<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Гони бабло</title>
    <link href="static/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow" style="color: #0000FF">
    <h5 class="my-0 mr-md-auto font-weight-normal">Электронный магазин</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="main.html">Главная</a>
        <a class="p-2 btn btn-outline-primary" href="catalog.html">Каталог товаров</a>
        <a class="p-2 btn btn-outline-primary" href="settings.html">Настройки</a>
    </nav>
</div>
<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-md-5 col-sm-8">
        <div class="card text-bg-secondary">
            <div class="card-body" >
                <form>
                    <h3>Оставьте заявку и мы с Вами свяжемся</h3>
                    <div class="mb-3">
                        <input type="text" class="form-control" placeholder="Имя">
                    </div>
                    <div class="mb-3" >
                        <input type="email" class="form-control" placeholder="Email">
                    </div>
                    <div class="mb-3">
                        <textarea class="form-control" placeholder="Сообщение" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Отправить</button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
